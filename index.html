<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Caro - Hoa Anh Đào Rơi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #ffd1dc 0%, #ffe6eb 50%, #fff0f5 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Container cho các cánh hoa anh đào */
        #sakura-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .petal {
            position: absolute;
            background: radial-gradient(circle, #ffb7c5 0%, #ff69b4 100%);
            border-radius: 15px 0 15px 0;
            opacity: 0.8;
            pointer-events: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10px) rotate(0deg);
                opacity: 0.9;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0.2;
            }
        }

        /* Giao diện chính game */
        .game-container {
            z-index: 2;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            padding: 25px 35px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(220, 100, 130, 0.2);
            text-align: center;
            border: 2px solid rgba(255, 182, 193, 0.6);
        }

        h1 {
            color: #d81b60;
            margin-bottom: 10px;
            font-size: 2.2rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .status {
            font-size: 1.2rem;
            color: #4a4a4a;
            margin-bottom: 20px;
            font-weight: 600;
        }

        /* Bàn cờ */
        .board {
            display: grid;
            grid-template-columns: repeat(15, 30px);
            grid-template-rows: repeat(15, 30px);
            gap: 1px;
            background-color: #d1a153;
            padding: 5px;
            border-radius: 8px;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.15);
            margin: 0 auto;
        }

        .cell {
            width: 30px;
            height: 30px;
            background-color: #fce4ec;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
user-select: none;
            transition: background 0.2s;
        }

        .cell:hover {
            background-color: #f8bbd0;
        }

        .cell.x {
            color: #e91e63;
        }

        .cell.o {
            color: #1e88e5;
        }

        /* Nút reset */
        .btn-reset {
            margin-top: 20px;
            padding: 10px 25px;
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(45deg, #ff6b81, #ff4757);
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-reset:hover {
            transform: translateY(-2deg);
            box-shadow: 0 6px 20px rgba(255, 71, 87, 0.6);
        }
    </style>
</head>
<body>

    <div id="sakura-container"></div>

    <div class="game-container">
        <h1>🌸 Caro Hoa Anh Đào 🌸</h1>
        <div class="status" id="status">Lượt chơi: Người chơi X</div>
        <div class="board" id="board"></div>
        <button class="btn-reset" onclick="resetGame()">Chơi lại</button>
    </div>

    <script>
        // --- Hiệu ứng Cánh hoa anh đào rơi ---
        const sakuraContainer = document.getElementById('sakura-container');
        const PETAL_COUNT = 30;

        function createPetal() {
            const petal = document.createElement('div');
            petal.classList.add('petal');
            
            const size = Math.random() * 10 + 10; // 10px - 20px
            petal.style.width = `${size}px`;
            petal.style.height = `${size}px`;
            
            petal.style.left = `${Math.random() * 100}vw`;
            
            const duration = Math.random() * 5 + 5; // 5s - 10s
            petal.style.animationDuration = `${duration}s`;
            
            const delay = Math.random() * 5;
            petal.style.animationDelay = `${delay}s`;

            sakuraContainer.appendChild(petal);
        }

        for (let i = 0; i < PETAL_COUNT; i++) {
            createPetal();
        }

        // --- Logic Game Caro 15x15 ---
        const BOARD_SIZE = 15;
        let boardState = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(''));
        let currentPlayer = 'X';
        let gameActive = true;

        const boardElement = document.getElementById('board');
        const statusElement = document.getElementById('status');

        function createBoard() {
            boardElement.innerHTML = '';
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    cell.addEventListener('click', handleCellClick);
boardElement.appendChild(cell);
                }
            }
        }

        function handleCellClick(e) {
            const r = parseInt(e.target.dataset.row);
            const c = parseInt(e.target.dataset.col);

            if (boardState[r][c] !== '' || !gameActive) return;

            boardState[r][c] = currentPlayer;
            e.target.textContent = currentPlayer;
            e.target.classList.add(currentPlayer.toLowerCase());

            if (checkWin(r, c)) {
                statusElement.textContent = `🎉 Người chơi ${currentPlayer} chiến thắng!`;
                gameActive = false;
                return;
            }

            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            statusElement.textContent = `Lượt chơi: Người chơi ${currentPlayer}`;
        }

        function checkWin(r, c) {
            const player = boardState[r][c];
            const directions = [
                [[0, 1], [0, -1]],   // Ngang
                [[1, 0], [-1, 0]],   // Dọc
                [[1, 1], [-1, -1]],  // Chéo chính
                [[1, -1], [-1, 1]]   // Chéo phụ
            ];

            return directions.some(dir => {
                let count = 1;
                dir.forEach(([dr, dc]) => {
                    let nr = r + dr;
                    let nc = c + dc;
                    while (
                        nr >= 0 && nr < BOARD_SIZE &&
                        nc >= 0 && nc < BOARD_SIZE &&
                        boardState[nr][nc] === player
                    ) {
                        count++;
                        nr += dr;
                        nc += dc;
                    }
                });
                return count >= 5;
            });
        }

        function resetGame() {
            boardState = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(''));
            currentPlayer = 'X';
            gameActive = true;
            statusElement.textContent = `Lượt chơi: Người chơi ${currentPlayer}`;
            createBoard();
        }

        // Khởi tạo bàn cờ lần đầu
        createBoard();
    </script>
</body>
</html>
